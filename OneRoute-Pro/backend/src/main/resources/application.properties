server.address=127.0.0.1
server.port=8081
server.tomcat.threads.max=16
server.tomcat.accept-count=32
server.tomcat.connection-timeout=10s
server.error.include-message=never
spring.application.name=oneroute-pro
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.parser.strict-duplicate-detection=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.validator-url=none
management.endpoints.web.exposure.include=health,info
oneroute.root=.
